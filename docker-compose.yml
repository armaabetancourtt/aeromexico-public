services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: publico-vuelos-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in .env}
      NODE_ENV: ${NODE_ENV:-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    expose:
      - "3000"
    volumes:
      - public_logs:/app/logs
    networks:
      - vuelos-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: publico-vuelos-frontend
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - vuelos-net

volumes:
  public_logs:

networks:
  vuelos-net:
    driver: bridge
